services:
  app:
    build: .
    ports:
      - "8020:8000" # Acessa no navegador por http://localhost:8020
    volumes:
      - ./:/var/www/html
    user: "1000:1000"
    container_name: paradigmas-app

  mysql:
    image: mysql:8.4
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: paradigmas-prog
      MYSQL_USER: paradigmas
      MYSQL_PASSWORD: paradigmas
      MYSQL_ROOT_PASSWORD: root
    container_name: paradigmas-mysql

  adminer:
    image: adminer
    ports:
      - "8040:8080" # A porta 8040 está correta!
    depends_on:
      - mysql
    container_name: paradigmas-adminer
